name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # No dependencies and no lockfile: Node 24 runs the .ts tests directly.
      - run: node --test "tests/*.test.ts"
